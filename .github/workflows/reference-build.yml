name: Reference build

# Builds the upstream reference app (with the golden harness patch) in its pinned Docker image, then
# checks that a fresh recording reproduces every committed golden fixture. Runs only when the
# upstream pin, the build, the patch or the golden harness changes, since it takes a few minutes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reference/**
      - tools/reference-build/**
      - tools/reference-patch/**
      - tools/golden/**
      - fixtures/golden/**
  pull_request:
    paths:
      - reference/**
      - tools/reference-build/**
      - tools/reference-patch/**
      - tools/golden/**
      - fixtures/golden/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: tools/reference-build/build.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test
        run: |
          (cd .reference-site && python3 -m http.server 8000 --bind 127.0.0.1 &)
          sleep 1
          node tools/reference-build/smoke.mjs
      - name: Golden fixtures reproduce
        run: pnpm golden:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-smoke
          path: test-results/reference-smoke.png
