name: Deploy to GitHub Pages

# Publishes the app build to https://noiseweaver.github.io/Perun/ on every push to main,
# so it can be installed as a PWA (Safari > Share > Add to Home Screen on iPhone and iPad). Needs
# Settings > Pages > Source set to "GitHub Actions" once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the build bundles upstream's example circuits from the reference submodule
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      # the site lives under /<repo>/, and the app, manifest and service worker follow BASE_URL
      - run: pnpm --filter @perun/app exec vite build --base="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
