name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the viewer serves upstream's example circuits from the reference submodule
          submodules: true
      - name: Frozen notes are not edited
        # The frozen files must keep exactly this content (git hash-object). A pull request
        # that merges main and resolves a conflict in them by keeping its own side fails here.
        run: |
          echo "26aeceaefd52762ecf5e083dd7a4bad784d7479b  docs/PROGRESS.md
          51416cc645c8d074a34e5f4cd3ea8e71e3c3f52f  docs/DEVIATIONS.md" | while read -r want file; do
            if [ "$(git hash-object "$file")" != "$want" ]; then
              echo "::error file=$file::$file is frozen. Restore it from main and put the entry in docs/progress/ or docs/deviations/ (see their README)."
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # the Obsidian plugin (packages/obsidian): main.js, manifest.json, styles.css
      - run: pnpm --filter @perun/obsidian build
      - uses: actions/upload-artifact@v4
        with:
          name: perun-obsidian
          path: packages/obsidian/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
