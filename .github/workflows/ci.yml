name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the viewer serves upstream's example circuits from the reference submodule
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # the Obsidian plugin (packages/obsidian): main.js, manifest.json, styles.css
      - run: pnpm --filter @perun/obsidian build
      - uses: actions/upload-artifact@v4
        with:
          name: perun-obsidian
          path: packages/obsidian/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
